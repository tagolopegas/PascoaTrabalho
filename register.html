<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registar - PetApp</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav id="nav"></nav>
<div class="form-wrap">
  <h2>Criar conta</h2>
  <div id="msg"></div>
  <form id="reg-form">
    <div class="field"><label>Nome</label><input id="nome" type="text" required></div>
    <div class="field"><label>Data de Nascimento</label><input id="dob" type="date"></div>
    <div class="field"><label>Morada</label><input id="morada" type="text"></div>
    <div class="field"><label>Email</label><input id="email" type="email" required></div>
    <div class="field"><label>Password</label><input id="password" type="password" required></div>
    <button class="btn-primary" type="submit">Registar</button>
  </form>
  <p class="form-link">Já tens conta? <a href="login.html">Entrar</a></p>
</div>
<script src="script.js"></script>
</body></html>
