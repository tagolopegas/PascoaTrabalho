<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - PetApp</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav id="nav"></nav>
<div class="form-wrap">
  <h2>Entrar</h2>
  <div id="msg"></div>
  <form id="login-form">

    <button class="btn-primary" type="submit">Entrar</button>
  </form>
  <p class="form-link">Não tens conta? <a href="register.html">Registar</a></p>
</div>
<script src="script.js"></script>
</body></html>
